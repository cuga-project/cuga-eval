version: 2
updates:
  # No "uv" (Python) ecosystem entry: pyproject.toml declares `cuga` as an
  # editable path dependency at `../cuga-agent` — deliberately outside this
  # repo, since cuga-eval is designed to always integration-test against
  # cuga-agent's live main (not a pinned version), the same way CI checks it
  # out as a sibling before every uv sync. Dependabot requires path-based
  # dependencies to resolve inside the scanned repo's own source tree
  # (dependabot-core#8428, #12945, #13872 are the same class of failure), so
  # every "uv" ecosystem run fails outright with "Dependabot couldn't fetch
  # all your path-based dependencies" before it can even look at the other,
  # normal PyPI packages in the same lockfile — there's no config (ignore:
  # or otherwise) that works around a structurally-unreachable path source.
  # Nesting cuga-agent inside this repo (e.g. a git submodule) would make
  # Dependabot happy but pins to one commit instead of tracking main, which
  # defeats the point of this repo. pip-audit (CI's security job + the
  # weekly dependency-audit.yml) remains the vulnerability-detection
  # backstop for Python deps; version bumps for them stay manual.

  # GitHub Actions version pins in .github/workflows/*.yml (actions/checkout,
  # astral-sh/setup-uv, actions/setup-python, etc.). Patch/minor only — majors
  # stay ungrouped so automerge cannot squash an actions/checkout v4→v5 bump
  # into a patch PR. 08:00 (not 06:00) so this doesn't pile onto
  # dependency-audit.yml's 06:00 Monday sweep.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    groups:
      github-actions-patch-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
