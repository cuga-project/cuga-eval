name: Dependabot auto-merge

# Auto-approves and enables auto-merge for Dependabot patch/minor PRs once
# required checks (Lint, Tests, Security, CodeRabbit) pass. Major-version
# bumps are left for manual review.
#
# Runs on `pull_request` (not `pull_request_target`): Dependabot pushes to a
# branch in this repo, not a fork, so there's no cross-trust boundary to
# protect against here, and pull_request_target would add privilege surface
# for no benefit.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and enable auto-merge (patch/minor only)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve \
            --body "Auto-approved: Dependabot ${{ steps.metadata.outputs.update-type }} update for ${{ steps.metadata.outputs.dependency-names }}."
          gh pr merge "$PR_URL" --auto --squash

      - name: Flag major updates for human review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "Major version update — not auto-merged, needs manual review."
