# AutomationBench best method (2026-11-08), Haiku 5.5 agent, 10 tuning tasks of fresh3. In-sample. Baseline + read-back turn.
policy:
  package: none
  sources: {data: false, discovery: false, request: false}
  authority: {supersedes: false}
  checkers:
    rules: off
    gate: {mode: off}
    verifier: {mode: off}
    write_checks: off  # separate hooks, as measured
  organizers:
    procedure_tools: off
    guide: off
    loop: off
    sop_tracker: off
    navigator: off
    requirements_tracker: off
  obligations: {producers: []}
  decisions: {mode: off}
  notes: {work_method: [readback]}
