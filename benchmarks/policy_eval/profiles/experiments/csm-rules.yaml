# CSM (EnterpriseOps-Gym), 2026-11-08: the typed rules of the CSM skill package with the write verifier (as itsm-rules).
policy:
  package: packages/csm/{policy}/skill_v1/package.json
  sources: {data: false, discovery: false, request: false}
  authority: {supersedes: false}
  checkers:
    rules: on
    gate: {mode: off}
    verifier: {mode: on, model: aws/claude-haiku-5-5, scope: all_statements, may_deny: false}
    write_checks: off  # separate hooks, as measured
  organizers:
    procedure_tools: off
    guide: off
    loop: off
    sop_tracker: off
    navigator: off
    requirements_tracker: off
  obligations: {producers: []}
  decisions: {mode: off}
