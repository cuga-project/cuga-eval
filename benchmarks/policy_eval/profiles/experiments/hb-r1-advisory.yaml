# Round 1b (2026-11-08, HANDBOOK Vanguard, Haiku 5.5). In-sample (tuning tasks). Base: handbook-haiku-graph-gate.
# + the SOP loop in advisory style (cases and checks listed by Haiku, one work turn, no stops), on the same package.
policy:
  package: packages/handbook/{policy}/claude_v1/package.json
  sources: {data: false, discovery: false, request: false}
  authority: {supersedes: false}
  checkers:
    rules: off
    gate: {mode: on, model: aws/claude-haiku-5-5, scope: active_procedures, min_strength: none}
    verifier: {mode: off}
    write_checks: off  # separate hooks, as measured
  organizers:
    procedure_tools: on
    guide: off
    loop: {mode: on, model: aws/claude-haiku-5-5, style: advisory, rules_from_data: true}
    sop_tracker: off
    navigator: off
    requirements_tracker: off
  obligations: {producers: []}
  decisions: {mode: off}
