# Listing + the reporting check (checkers.unasked_report), no turn after the final answer. AutomationBench with
# DeepSeek-V4.1-Flash: strict pass 80.0% and 77.8% in two runs on ab-policy-rep90 (agent alone 61.1%); tuning tasks, one trial
# per run. `compile` names the model of the intake and of the check. Needs a polisys with the check (polisys PR 17).
policy:
  package: none
  sources: {data: true, discovery: false, listing: true, listing_data: true, request: false}  # nothing on reads the request
  authority: {supersedes: true}
  checkers:
    rules: off
    compile: deepseek-4-1-flash  # the intake model (extraction of the listed rule records, and the check below)
    gate: {mode: off}
    verifier: {mode: off}
    unasked_report: deny
    write_checks: off  # separate hooks, as measured
  organizers:
    procedure_tools: off
    guide: off
    loop: off
    sop_tracker: off
    navigator: off
    requirements_tracker: off
  obligations: {producers: []}
  decisions: {mode: off}
  notes: {work_method: []}  # no read-back turn: the first final answer is the answer
