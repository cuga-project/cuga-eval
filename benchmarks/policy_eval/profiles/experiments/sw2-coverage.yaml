# U: Y + the request's exact values (addresses, codes, quoted texts) that no call used are named at the reply (code).
# Arm of the second sweep (7 HR tasks with validated checks): no harm, gain not shown.
# Needs a polisys that has the finish check and the code guards (cuga-project/polisys PR #10).
policy:
  package: none
  sources: {data: false, discovery: false, request: false}
  authority: {supersedes: false, value_lists: tool}
  checkers:
    rules: off
    gate: {mode: off}
    verifier: {mode: off}
    write_checks: off
    default_values: {mode: on, model: agent, cache_dir: ~/.cache/polisys/tool_notes}
  organizers:
    procedure_tools: off
    guide: off
    loop: off
    sop_tracker: off
    navigator: off
    requirements_tracker: off
  obligations: {producers: []}
  decisions: {mode: off}
  notes:
    work_method: [lookup_retry, finish_check, literal_values, literal_coverage]
