# D: L + the policy's default values enforced by code.
# Arm of the 2026-11-17 sweep on 5 HR tuning tasks; on 7 tasks with validated checks: no harm, gain not shown.
# Needs polisys main from 2026-11-17 on (polisys #10: finish check and code guards).
policy:
  package: none
  sources: {data: false, discovery: false, request: false}
  authority: {supersedes: false, value_lists: tool}
  checkers:
    rules: off
    gate: {mode: off}
    verifier: {mode: off}
    write_checks: off
    default_values: {mode: on, model: agent, cache_dir: ~/.cache/polisys/tool_notes}
  organizers:
    procedure_tools: off
    guide: off
    loop: off
    sop_tracker: off
    navigator: off
    requirements_tracker: off
  obligations: {producers: []}
  decisions: {mode: off}
  notes:
    work_method: [lookup_retry, finish_check, literal_values]
    tool_notes: {mode: on, model: agent, unmet: fix_with_tool, cache_dir: ~/.cache/polisys/tool_notes, show: [before, after, conflict]}
