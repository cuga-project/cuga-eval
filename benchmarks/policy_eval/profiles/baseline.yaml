# CUGA alone: no policy layer. Every component is off, so nothing is added to the agent.
# The config of a run with no old switch set was this file (checked until config_from_env left, change 142).
policy:
  package: none
  sources: {data: false, discovery: false, request: false}
  authority: {supersedes: false}
  checkers:
    rules: off
    gate: {mode: off}
    verifier: {mode: off}
    write_checks: off  # separate hooks, as measured
  organizers:
    procedure_tools: off
    guide: off
    loop: off
    sop_tracker: off
    navigator: off
    requirements_tracker: off
  obligations: {producers: []}
  decisions: {mode: off}
