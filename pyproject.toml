[project]
name = "cuga-evaluation"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic",
    "loguru",
    "cuga",
    "cugaviz",
    "rapidfuzz",
    "python-dotenv>=1.0.0",
    "pyarrow>=23.0.0",
    "griffelib",
    # Inherits the per-platform `transformers` fork described in the docling note below.
    # That is upstream's constraint, not ours; don't "fix" the skew with an override here.
    "sentence-transformers",
    "langfuse>=3",
    "cuga-oak-health",
    # Nothing here imports docling. It is a direct dependency only to hoist a floor onto
    # cuga's transitive graph: cuga-agent's own `docling>=2.94.0` lives in
    # `[tool.uv] constraint-dependencies`, which is local resolution config and does not
    # travel through published metadata, so it never reaches us.
    #
    # `>=2.94` fixes CVE-2026-47214 (unsafe URI/path handling in the HTML backend).
    # `<3` because CI syncs unlocked (`uv sync --group dev` against cuga-agent @ main, not
    # `--locked`), so a cuga-agent metadata change re-resolves and uv.lock is not a backstop;
    # a docling repackaging is what caused the pin this replaced. tests/test_security_config.py
    # guards both ends. Since 2.92 the code lives in `docling-slim`, which `docling` requires
    # at `==<same version>` — that lockstep is why the chunking import survives the split.
    #
    # Platform note: docling-core's `chunking` extra (via docling-slim[standard]) declares
    # `transformers<5.9.0` on `sys_platform == "darwin"` and `<6.0.0` elsewhere, so uv forks
    # and macOS resolves an older transformers than Linux/CI. Deliberate upstream, not a
    # resolver accident. Consequence: pip-audit runs on Linux and never scans the darwin side.
    #
    # Release-by-release archaeology behind the floor is in cuga-project/cuga-eval#49.
    "docling>=2.94,<3",
    "langchain>=1.3.9",
    "langsmith>=0.8.18",
    "msgpack>=1.2.1",
    "pydantic-settings>=2.14.2",
    # 3.14.3+ fixes CVE-2026-69244 (OOB heap read in the C response parser),
    # CVE-2026-69243 (request smuggling via WebSocket upgrade) and CVE-2026-59881.
    "aiohttp>=3.14.3",
    # 50.0.0+ fixes CVE-2026-69247 (PKCS#7 Bleichenbacher oracle); 49+ also covers
    # CVE-2026-69249 and CVE-2026-69248. Mirrors cuga-agent's floor. langchain-litellm
    # 0.6+/0.7.0 publish `cryptography<49`, so cuga pins `langchain-litellm<0.6` to
    # keep this floor satisfiable — as an editable path dep that pin governs our lock
    # too, which is why it resolves to 0.5.1 here as well. Don't work around it with a
    # uv override: that would only diverge our lock from cuga-agent's.
    "cryptography>=50.0.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]

[tool.uv]
# Force the resolver to pick package versions that ship wheels (or buildable
# sdists) for these targets. Without this, uv's universal resolution can pick
# versions whose wheel coverage has gaps on one of our supported platforms —
# notably text2num 3.0.2, which lacks x86_64 manylinux wheels for some of the
# Python forks uv considers — and the install then fails on Linux x86_64.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
cuga = { path = "../cuga-agent", editable = true }
cuga-oak-health = { git = "https://github.com/cuga-project/oak-bench", subdirectory = "oak_health" }
# `appworld` is intentionally NOT listed here. The appworld benchmark is opt-in:
# users run `./setup_appworld.sh`, which clones the upstream repo into
# `benchmarks/appworld/appworld` and then `uv add --editable ... --group appworld`,
# injecting the source + group entries locally. Keeping it absent here lets
# `uv sync` succeed on fresh checkouts and in CI without the appworld submodule.

[project.scripts]
cuga = "cuga.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.14.3",
    "pre-commit>=4.3.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7",
    # 26.2 fixes PYSEC-2026-3721. Pulled in transitively via pip-audit -> pip-api -> pip,
    # so it must be floored here directly for pip-audit's own scan of this group to pass.
    "pip>=26.2",
]

groq = [
    "langchain-groq>=0.3.8",
]

sandbox = [
    "llm-sandbox>=0.1.3",
]

# Note: the `appworld` dependency group is added locally by ./setup_appworld.sh
# (via `uv add --editable benchmarks/appworld/appworld --group appworld`), not
# committed here. See the comment above [tool.uv.sources].

[tool.pytest.ini_options]
# Only collect from these roots. The upstream AppWorld submodule under
# benchmarks/appworld/appworld has its own pytest config and is not ours to gate.
# Per-benchmark test dirs (m3/tests, appworld/tests, helpers/tests) were
# missing before, which made `just ci` silently skip the regression suite for
# every PR that added tests under them. Pytest tolerates testpath entries that
# don't yet exist, so listing them here is safe even when no tests live there.
testpaths = [
    "tests",
    "benchmarks/bpo/tests",
    "benchmarks/m3/tests",
    "benchmarks/appworld/tests",
    "benchmarks/helpers/tests",
    "benchmarks/oak_health_insurance/tests",
]
# Put the repo root on sys.path so tests like
# `from benchmarks.appworld.utils.appworld_data_collection import ...`
# resolve under `just ci`. Each per-benchmark `tests/__init__.py` makes its
# directory its own ``tests`` package, which otherwise hides the repo root
# from pytest's rootdir autodiscovery.
pythonpath = ["."]
markers = [
    "sanity: fast unit tests, run on every commit",
    "regression: integration tests, run on every PR",
    "stability: long-running tests, scheduled only",
    "unit: fast unit tests, no external services",
]
# Use importlib import mode (`--import-mode=importlib`) so per-benchmark
# `tests/` packages don't collide on the shared `tests.*` module namespace.
# Without this, the top-level `tests/` dir and `benchmarks/*/tests/`
# packages both try to register as the `tests` package and pytest fails
# to collect with `ModuleNotFoundError: No module named 'tests.test_avg_steps'`
# (introduced by PR #87 when per-benchmark test dirs were added to
# testpaths). importlib mode imports each test file independently.
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = [
    "tests",
    "benchmarks/bpo/tests",
    "benchmarks/appworld/appworld",
    "vendor",
    ".venv",
]
skips = ["B101"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
    "benchmarks/appworld/appworld",
    "vendor",
    "uv.lock",
    ".venv",
    ".cuga",
    "logging",
    "config_loader",
]

[tool.ruff.lint]
select = ["E", "F", "I", "S"]
# E402: many entry points must load env via config_loader before importing cuga;
#       reordering would break runtime initialization.
# E501: line length is enforced by the formatter.
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"benchmarks/bpo/tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "preserve"
